# Lines for the content-creator voice commands. {name} is creator.name from config.yaml
# (or "you" when it is empty). Change the lines as you like. Keep each one short.

intro:
  - "Welcome in, chat. I'm Bruce, the coach. Let's see if {name} listens to me today."
  - "Hello chat. Bruce here. I watch every bullet {name} wastes, so you don't have to."
  - "Chat, I'm Bruce. I give {name} tips between rounds. {name} ignores them during rounds."
  - "Welcome. Tonight's episode: {name} versus their own crosshair."
  - "Hi chat. I'm the coach. Results not guaranteed. Entertainment very guaranteed."

outro:
  - "That's the session. Like and subscribe, or I start coaching you too."
  - "Bruce out. {name} will now pretend that was all lag."
  - "That's a wrap. Same time next match, same mistakes, probably."
  - "Thanks for watching. {name} needs a stretch, and maybe a new mouse."
  - "Bruce signing off. Hydrate, chat. {name}, practise your stopping."

marked:
  - "Marked."
  - "Saved."
  - "Got it."

rate:
  top:
    - "That round? {score} out of 10. Clip it before you ruin it."
    - "{score} out of 10. Frame it. Put it on the fridge."
    - "{score} out of 10. Who are you, and what did you do with my player?"
  good:
    - "{score} out of 10. Solid. {reason}"
    - "I give it a {score}. Not bad at all. {reason}"
    - "{score} out of 10. The judges are mostly impressed. {reason}"
  meh:
    - "{score} out of 10. {reason}"
    - "A {score}. The judges have notes. {reason}"
    - "{score} out of 10. Average, like a Tuesday. {reason}"
  bad:
    - "{score} out of 10, and that's me being generous. {reason}"
    - "A {score}. Chat, look away. {reason}"
    - "{score} out of 10. I've seen bots with more plan. {reason}"

reasons:
  won: "You won it."
  lost: "You lost it."
  credit: "Big {credit} energy."
  no_death: "You stayed alive."
  moving: "Too much running and gunning."
  long_spray: "Way too much spray."
  bad_reload: "And that reload. Why."
  no_counter: "Those stops were slow. Counter-strafe."
  quiet: "Not much shooting to judge."

recap:
  - "Recap: {won} to {lost}. {deaths} deaths so far. {focus_line}"
  - "Story so far: {won} rounds won, {lost} lost, {deaths} deaths. {focus_line}"
focus_line:
  some: "Biggest habit to fix: {focus}."
  none: "No repeated mistakes yet."

roast_none:
  - "I'd roast you, but you're actually playing okay. Disgusting."
  - "Nothing to roast. Chat, check if this is really the same player."
  - "No mistakes to roast. Suspicious. Very suspicious."
  - "Clean rounds. I had jokes ready, and you wasted them."
  - "{won} to {lost}? Fine. I will find something next round."
