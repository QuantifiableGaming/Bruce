- "Three rounds down the toilet. Flush it and reset."
- "Fuck that round. Seriously, forget it. Next one."
- "You're playing like you're hungover. Wake the hell up."
- "That streak is cursed. Break the curse. Win one, damn it."
- "Okay, ass-kicking is over for now. Your turn to give one."
- "Stop sulking, degen. You've survived worse decisions than that."
- "Shake it off. Even your worst Friday night went better than that."
credit:
- "Holy shit. Who are you and where's the bum I usually coach?"
- "Now that was filthy. In the good way."
- "Damn, that was clean. Don't let it go to your head."
- "Fuck yes. More of that."
- "That round was sexier than your search history. Barely."
- "Look at you, finally earning the attention."
- "Clip it before you ruin it, legend."
- "That was nasty. I'm proud and a little scared."
focus:
- "One fucking thing this round: {focus}. That's it."
- "Listen, degen. {focus}. Do it or I'll roast you all night."
- "Simple job this round: {focus}. Don't screw it up."
tips:
  crosshair_low:
  - "Your crosshair is down at their ankles. Aim at the damn head."
  - "Why are you aiming at the floor? Is there money down there? Head height."
  - "Stop staring at their feet, weirdo. Crosshair up."
  crosshair_high:
  - "You're aiming at the sky like it owes you money. Bring it down."
  - "Lower, champ. Heads, not birds."
  moving_shots:
  - "Running and gunning like a headless chicken. Stop, then shoot."
  - "You can't shoot for shit while you move. Plant your feet."
  - "Stop dancing, you're not in a club. Stand still, then fire."
  - "Moving shots again? Bold. Stupid, but bold. Stop first."
  long_spray:
  - "You sprayed that like a broken fire hose. Short bursts, damn it."
  - "All that spray and nothing landed. Story of your life. Burst it."
  - "Let go of the trigger, you maniac. Three or four shots."
  no_counter_strafe:
  - "Your stops are slow as hell. Tap the opposite key, then shoot."
  - "Let go and tap the other way. It stops you faster, genius."
  bad_reload:
  - "Reloading in the middle of a gunfight? Fucking brave. Also dead. Cover first."
  - "Who reloads in the open? You, apparently. Win the fight, then reload."
match_good:
  crosshair: "Match over. Your crosshair was at head height in {good} of {total} fights. Not bad, you degenerate."
  strafe: "Match over. You stopped before shooting in {good} of {total} fights. Hell yes."
  credit: "Match over. {count} highlight rounds. Filthy."
  fallback: "Match over. Read the report. Drink some water. Touch some grass."

