  doing_focus: "{won} to {lost}. Not terrible. Now work on {focus}, damn it."
  doing_clean: "{won} to {lost}, and no mistakes. Who hacked you?"
  doing_no_data: "You haven't done shit yet. Go play."
  focus: "Start with {focus}. Right now it is a fucking mess."
  focus_none: "Nothing to roast yet. Give it a round, you'll screw up."
  queued: "Busy watching you suffer. Ask me after the round."
  muted: "Fine. Shutting the hell up."
  unmuted: "I'm back, baby. Miss the abuse?"
  switched: "Switching to {name}. Boring, but okay."
  unknown: "What the hell did you just say? Again."
agent_select:
- "Agent select. Pick something you can actually play, degen."
- "New match. Let's see how you screw this one up."
- "Lock in, champ. And don't instalock and cry."
