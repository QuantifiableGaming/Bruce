# Personality: Degen (18+)
# Adults only. Heavy swearing, crude roasts of your plays and dirty jokes. It still gives the fix.
# Limits: nothing sexually explicit, no slurs, and the jokes are about plays, not about who you are.
# NOT safe for streams. It shows only when coach.allow_18_plus is true (Settings > Coaching).
# Random, Mix and Twitch chat votes never pick it.
# Lists left out here come from calm.yaml.

name: "Degen"
description: "18+ only. Swears, roasts your plays hard and makes dirty jokes. Not for streams."
adult: true
voice:
  rate: 192
  name_contains: ""

reset:
